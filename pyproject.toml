[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "disimpy"
dynamic = ["version"]
description = "Massively parallel diffusion MR simulator"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["license.txt"]
authors = [{name = "Leevi Kerkelä", email = "leevi.kerkela@protonmail.com"}]
dependencies = [
    "matplotlib>=3.9",
    "nvidia-cuda-runtime-cu12>=12.3,<13",
    "numba>=0.68",
    "numba-cuda-mlir==0.5.4",
    "numpy>=2",
]

[project.optional-dependencies]
test = ["pytest>=7.4.4", "scipy>=1.13", "numba-cuda>=0.30.4"]
docs = ["sphinx>=7.0.1", "furo>=2023.05.20", "nbsphinx>=0.9.2", "ipython>=8.12.0"]
cuda12 = ["numba-cuda-mlir[cu12]==0.5.4"]
cuda13 = ["numba-cuda-mlir[cu13]==0.5.4"]

[project.urls]
Homepage = "https://github.com/kerkelae/disimpy"
Documentation = "https://disimpy.readthedocs.io/"

[tool.setuptools.dynamic]
version = {attr = "disimpy._version.__version__"}

[tool.setuptools.packages.find]
include = ["disimpy*"]

[tool.setuptools.package-data]
"disimpy.tests" = ["*.txt", "*.npy", "*.pkl", "*.stl", "*.scheme"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
